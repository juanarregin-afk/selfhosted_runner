name: Trigger-Dispatch
on: 
  workflow_dispatch:
    inputs:
      nivel:
        description: 'Nivel'
        required: true        
        type: choice
        options:
          - bajo
          - medio
          - alto
      nombre:
        description: 'Ingresa tu nombre'
        required: false
        type: string
        default: 'Anonimo'        
  
jobs:

  demo:
  
    runs-on: ubuntu-22.04    
    steps:
      - name: Comparacion de nombre
        if: ${{ (github.event.inputs.nombre == 'Anonimo') && (true) }} 
        run: echo 'Condicion ok'
        
      - name: Saludar
        run: echo Parametros
      - name: Saludo input
        run: echo ${{ github.event.inputs.nombre }}
